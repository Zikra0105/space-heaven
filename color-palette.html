<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f8f8;
        }
        h1 {
            margin-top: 20px;
        }
        .container {
            margin: 20px auto;
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }
        .color-box {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .color {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        .btn {
            background-color: #a86d7d;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #b3004b;
        }
        input[type="color"] {
            margin-top: 15px;
            cursor: pointer;
            border: none;
            width: 50px;
            height: 50px;
        }
         .base-color-container {
           display: flex; /* Aligns items in a row */
           align-items: center !important; /* Vertically centers them */
           gap: 10px !important; /* Adds spacing between elements */
        }
    </style>
</head>
<body>

    <h1>Color Palette Generator</h1>
    <div class="container">
        <p>Select a base color:</p>
        <input type="color" id="colorPicker" value="#ff7f50">
        <button class="btn" onclick="generatePalette()">Generate Palette</button>

        <div class="color-box" id="palette">
            <!-- Colors will be generated here -->
        </div>
    </div>

    <script>
        function hexToHSL(hex) {
    let r = parseInt(hex.substr(1,2), 16) / 255;
    let g = parseInt(hex.substr(3,2), 16) / 255;
    let b = parseInt(hex.substr(5,2), 16) / 255;

    let max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, l = (max + min) / 2;

    if (max === min) {
        h = s = 0; // No saturation
    } else {
        let d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);

        switch(max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
        }
        h *= 60;
    }

    return { h, s, l };
}

function HSLToHex(h, s, l) {
    s /= 100;
    l /= 100;

    let c = (1 - Math.abs(2 * l - 1)) * s;
    let x = c * (1 - Math.abs((h / 60) % 2 - 1));
    let m = l - c/2;
    let r, g, b;

    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }

    r = Math.round((r + m) * 255);
    g = Math.round((g + m) * 255);
    b = Math.round((b + m) * 255);

    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
}

function generatePalette() {
    const baseColor = document.getElementById("colorPicker").value;
    const paletteContainer = document.getElementById("palette");
    paletteContainer.innerHTML = ""; 

    let hsl = hexToHSL(baseColor);

    let colors = [
        HSLToHex(hsl.h, hsl.s * 100, Math.min(hsl.l * 100 + 20, 100)), // Lighter
        baseColor,
        HSLToHex(hsl.h, hsl.s * 100, Math.max(hsl.l * 100 - 20, 0)) // Darker
    ];

    colors.forEach(color => {
        let colorDiv = document.createElement("div");
        colorDiv.className = "color";
        colorDiv.style.backgroundColor = color;
        colorDiv.innerText = color;
        colorDiv.onclick = () => {
            navigator.clipboard.writeText(color);
            alert("Copied: " + color);
        };
        paletteContainer.appendChild(colorDiv);
    });
}

    </script>

</body>
</html>
