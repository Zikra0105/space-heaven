<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="checkout.css">
    <script src="script.js" defer></script>
    <!-- <script defer src="checkout.js"></script> -->
</head>

<body>


    <div class="checkout-container">
        <h1>Checkout</h1>

        <!-- Order Summary -->
        <div class="order-summary">
            <h2>Order Summary</h2>
            <ul id="checkout-items"></ul>
            <p><strong>Total Items:</strong> <span id="checkout-total-items">0</span></p>
            <p><strong>Total Price:</strong> ₹<span id="checkout-total-price">0.00</span></p>
        </div>

        <!-- Billing Details -->
        <div class="billing-details" style=" background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 600px;
        margin: 20px auto;
        animation: fadeIn 0.5s ease-in-out;">
            <h2 style=" font-size: 22px;
            color: #333;
            text-align: center;
            margin-bottom: 15px;">Billing Details</h2>
            <form id="checkout-form" style="display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;">

                <label for="name" style=" font-size: 16px;
                font-weight: bold;
                color: #444;">Full Name:</label>
                <input style=" width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 16px;" type="text" id="name" required>

                <label for="email" style=" font-size: 16px;
                font-weight: bold;
                color: #444;">Email:</label>
                <input type="email" style=" width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 16px;" id="email" required>

                <label for="address" style=" font-size: 16px;
                font-weight: bold;
                color: #444;">Shipping Address:</label>
                <textarea id="address" style=" width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 16px;" required></textarea>

                <label for="payment" style="font-size: 16px;
                font-weight: bold;
                color: #444;">Payment Method:</label>
                <select id="payment" style=" width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                font-size: 16px;">
                    <option value="card" style=" display: flex;
                    align-items: center;
                    gap: 10px;
                    font-size: 16px;
                    font-weight: bold;">Credit/Debit Card</option>
                    <option value="upi" style=" display: flex;
                    align-items: center;
                    gap: 10px;
                    font-size: 16px;
                    font-weight: bold;">UPI</option>
                    <option value="cod" style=" display: flex;
                    align-items: center;
                    gap: 10px;
                    font-size: 16px;
                    font-weight: bold;">Cash on Delivery</option>
                </select>

                <button type="submit" style="padding: 12px;
                background: #28a745;
                color: white;
                font-size: 18px;
                font-weight: bold;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: 0.3s;">Place Order</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let checkoutContainer = document.getElementById("checkout-items");
            let totalItemsElement = document.getElementById("checkout-total-items");
            let totalPriceElement = document.getElementById("checkout-total-price");
    
            let totalItems = 0;
            let totalPrice = 0;
    
            if (cart.length === 0) {
                checkoutContainer.innerHTML = "<li>Your cart is empty.</li>";
            } else {
                cart.forEach(item => {
                    let li = document.createElement("li");
                    li.classList.add("cart-item");
    
                    li.innerHTML = `
                        <img src="${item.image}" alt="${item.name}" width="80" style="border-radius: 5px;">
                        <div class="cart-details">
                            <p><strong>${item.name}</strong> (x${item.quantity})</p>
                            <p>₹${(item.price * item.quantity).toFixed(2)}</p>
                        </div>
                    `;
    
                    checkoutContainer.appendChild(li);
    
                    totalItems += item.quantity;
                    totalPrice += item.price * item.quantity;
                });
            }
    
            totalItemsElement.textContent = totalItems;
            totalPriceElement.textContent = `${totalPrice.toFixed(2)}`;
    
            // Custom alert function
            function showCustomAlert(message) {
                const alertBox = document.getElementById("custom-alert");
                alertBox.querySelector("p").textContent = message;
                alertBox.style.display = "flex";
    
                document.getElementById("alert-ok-btn").addEventListener("click", function () {
                    alertBox.style.display = "none";
                    localStorage.removeItem("cart");
                    window.location.href = "shopping.html#product";
                });
            }
    
            // Checkout form submission
            document.getElementById("checkout-form").addEventListener("submit", function (event) {
                event.preventDefault();
    
                const name = document.getElementById("name").value;
                const email = document.getElementById("email").value;
                const address = document.getElementById("address").value;
                const payment = document.getElementById("payment").value;
                const username = localStorage.getItem("loggedInUser") || "guest";
    
                fetch("http://127.0.0.1:5000/checkout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        name,
                        email,
                        address,
                        payment,
                        total_items: totalItems,
                        total_price: totalPrice
                    })
                })
                .then(response => response.json())
                .then(data => {
                    showCustomAlert(data.message || "🎉 Order Placed Successfully!");
                })
                .catch(error => {
                    console.error("Checkout error:", error);
                    alert("Error submitting order. Please try again.");
                });
            });
        });
    </script>
    
    <div id="custom-alert" class="custom-alert">
        <div class="custom-alert-box">
            <p>🎉 Order Placed Successfully!</p>
            <button id="alert-ok-btn">OK</button>
        </div>
    </div>



</body>

</html>
