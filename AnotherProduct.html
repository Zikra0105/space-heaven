<!DOCTYPE html>
<html lang="en" style="background:white;">
<head>
    <title>Another Product</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<script src="script.js" defer></script>
<body style="background:white;">
    <div id="cart-notification" style="display: none; position: fixed; top: 10px; right: 10px; background: #c44242; color: white; padding: 10px; border-radius: 5px;"></div>
    <div class="header-container">
        <a href="shopping.html#product" style="text-decoration:none;border-bottom: none;">
            <h1>Another Product</h1>
        </a>
        <span>
            <a href="cart.html" class="cart-icon">
                <i class='bx bx-shopping-bag'></i>
                <span id="cart-badge">0</span> <!-- Badge for cart count -->
            </a>
            &nbsp;&nbsp;&nbsp;&nbsp;
        </span>
    </div>
    <div class="card-content">
        <div class="row">
            <img src="img/product1.jpg" class="walla" alt="">
            <div class="card-body">
                <p>Product Description 1</p>
                <h5 class="price">Price $5000</h5>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <div class="row">
            <img src="img/product2.jpg" class="walla" alt="">
            <div class="card-body">
                <p>Product Description 2</p>
                <h5 class="price">Price $10000</h5>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        </div>
        <!-- Add more products as needed -->
    </div>
</body>
</html>
