<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="cart-container">
        <h1>Shopping Cart</h1>
        
        <span id="cart-badge" style="display: none;">0</span>

        <ul id="cart-items"></ul>
        
        <button id="clear-btn">Clear Cart</button>
        <button class="checkout-btn" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>

        <div class="cart-summary">
            <p>Total Items: <span id="total-items">0</span></p>
            <p>Total Price: <span id="total-price">₹0.00</span></p>
        </div>
        <a href="shopping.html#product" class="continue-shopping">Continue Shopping</a>

        <div id="cart-notification" style="display: none;"></div>
    </div>

    <style>
        html, body {
            height: auto;
            overflow-y: auto; /* Allow scrolling */
            margin: 0;
        }

        body {
            display: flex !important;
            flex-direction: column; /* Stack items vertically */
            align-items: center; /* Center horizontally */
            justify-content: flex-start; /* Prevent unwanted centering */
            min-height: 100vh; /* Full viewport height */
            padding-top: 20px;  /* Ensure full height */
            margin: 0;
            background: #f8e6c8;
            font-family: Arial, sans-serif;
            transition: transform 0.2s
        }

        .product-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%; 
            display: block;
        }

        .cart-container {
            width: 90%;
            max-width: 800px; 
            display: flex !important;
            flex-direction: column !important;
            gap: 10px;
            align-items: center;
            word-wrap: break-word; /* Breaks long words */
            overflow-wrap: break-word;
            margin: auto;
            padding: 20px;
            background: transparent;
            box-shadow: none;
            animation: slideIn 0.5s ease-in-out;
        }

        .cart-container div {
            max-width: 100%; 
            white-space: normal; /* Allows text to wrap */
        }

        h1 {
            font-size: 24px;
            color: #333;
        }

        .cart-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 50%;
            display: none;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Consistent spacing */
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff3e6;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            gap: 15px;
            min-height: 100px; /* Ensures uniform height */
        }

        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Ensures equal spacing */
        }

        .cart-details {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .quantity-controls button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .quantity-controls button:hover {
            background: #e63946;
        }

        .remove-btn, #clear-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            min-width: 80px;
        }

        .remove-btn, #clear-btn {
            flex-shrink: 0; /* Prevents button from shrinking */
        }

        .remove-btn:hover, #clear-btn:hover {
            background: #91343c;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            max-width: 250px;
            margin: 20px auto;
            padding: 12px;
            background: #ff5c5c;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #91343c;
        }

        .cart-summary {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            font-size: 20px;
            color: #cb298a;
            font-weight: bold;
            text-decoration: none;
            margin-top: 15px;
        }

        .continue-shopping:hover {
            color: rgb(148, 16, 236);
            text-decoration: underline;
        }

        .cart-notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #4caf50;
            color: white;
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
        }
        @keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(50px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}
    </style>
</body>
</html>
